name: Linux host checks and P2 compilation (no HIL)

on: [push, pull_request]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  host-language:
    name: Host language and P2 host scripts (Clang 19, ASan/UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the pinned Linux/x86-64 environment
        run: |
          test "$(uname -m)" = x86_64
          docker build --platform linux/amd64 -t berry-p2-ci -f tools/container/Dockerfile tools/container
          mkdir -p "$RUNNER_TEMP/berry-host"
          chmod 777 "$RUNNER_TEMP/berry-host"
      - name: Unit tests, complete language suite and all P2 host regressions
        run: |
          docker run --rm --network none --user 10000:10000 \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/berry-host,dst=/evidence" \
            --env ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            --env UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            --workdir /repo berry-p2-ci bash -euxo pipefail -c '
              python3 -m unittest discover -s tools/tests -p test_build_p2.py
              PYTHONPATH=/repo/tools python3 -c "from pathlib import Path; from build_p2 import snapshot_source; snapshot_source(Path(\"/repo\"), Path(\"/evidence/source\"))"
              cd /evidence/source
              failed=0
              for target in test test-p2-host; do
                code=0
                make "$target" CC=clang-19 PYTHON=python3 P2_LOCAL_CONFIG=/dev/null \
                  TEST_FLAGS="-O1 -g -DBE_DEBUG --coverage -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all -fno-pie -no-pie" \
                  P2_HOST_TESTS="$(printf "%s " tests/p2/host_*.be)" || code=$?
                printf "%s exit=%s\n" "$target" "$code"
                if [ "$code" -ne 0 ]; then failed=1; fi
              done
              exit "$failed"
            ' 2>&1 | tee "$RUNNER_TEMP/berry-host/host.log"
      - name: Retain host logs (not target execution evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-language-evidence
          path: ${{ runner.temp }}/berry-host/host.log
          if-no-files-found: error
          retention-days: 14

  native-regressions:
    name: Host allocator, clock, VM state and exceptions (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: native
            cc: clang-19
          - abi: '32'
            cc: gcc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the pinned Linux/x86-64 environment with real multilib
        run: |
          test "$(uname -m)" = x86_64
          docker build --platform linux/amd64 -t berry-p2-ci -f tools/container/Dockerfile tools/container
          mkdir -p "$RUNNER_TEMP/berry-native"
          chmod 777 "$RUNNER_TEMP/berry-native"
      - name: Execute production host logic with fatal ASan/UBSan
        run: |
          docker run --rm --network none --user 10000:10000 \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/berry-native,dst=/evidence" \
            --env TEST_CC=${{ matrix.cc }} --env TEST_ABI=${{ matrix.abi }} \
            --env ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            --env UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            --workdir /repo berry-p2-ci bash -euxo pipefail -c '
              PYTHONPATH=/repo/tools python3 -c "from pathlib import Path; from build_p2 import snapshot_source; snapshot_source(Path(\"/repo\"), Path(\"/evidence/source\"))"
              cd /evidence/source
              abi_flags=""
              if [ "$TEST_ABI" = 32 ]; then abi_flags="-m32"; fi
              # Collect every suite, but keep the job RED if any command fails.
              # In particular, no-small-pools is not an allowed-failure/skip.
              failed=0
              check() {
                local code=0
                "$@" || code=$?
                printf "check exit=%s: %s\n" "$code" "$*"
                if [ "$code" -ne 0 ]; then failed=1; fi
              }
              check python3 tools/test_p2_heap.py --cc "$TEST_CC" \
                --cflags="$abi_flags -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -fno-pie -no-pie"
              check python3 tools/test_p2_clock.py --cc "$TEST_CC" --abi "$TEST_ABI" --sanitize
              check python3 tools/test_p2_vm_state.py --cc "$TEST_CC" --abi "$TEST_ABI" --sanitize --debug
              check python3 tools/test_p2_vm_state.py --cc "$TEST_CC" --abi "$TEST_ABI" --bint 32 --no-small-pools --sanitize
              check python3 tools/test_exception_storage.py --cc "$TEST_CC" --cflags="$abi_flags" --sanitize
              check python3 tools/test_p2_cog_handles.py --cc "$TEST_CC"
              check python3 tools/test_p2_module_config.py
              exit "$failed"
            ' 2>&1 | tee "$RUNNER_TEMP/berry-native/native.log"
      - name: Retain real host test receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.abi }}-evidence
          path: |
            ${{ runner.temp }}/berry-native/native.log
            ${{ runner.temp }}/berry-native/source/build/**/results.json
            ${{ runner.temp }}/berry-native/source/build/**/*.log
          if-no-files-found: error
          retention-days: 14

  p2-compile:
    name: Compile standard LARGE/XMM p2edge32 (no hardware execution)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the pinned Linux/x86-64 environment
        run: |
          test "$(uname -m)" = x86_64
          docker build --platform linux/amd64 -t berry-p2-ci -f tools/container/Dockerfile tools/container
          mkdir -p "$RUNNER_TEMP/berry-target/proof"
          chmod 777 "$RUNNER_TEMP/berry-target/proof"
      - name: Bootstrap public pinned SDK, patch its libraries and compile real Berry
        run: |
          # Network is only needed for the public SDK clone. No devices, socket,
          # credentials, privileged mode, deployment or self-hosted runner.
          docker run --rm --network bridge --user 10000:10000 \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/berry-target/proof,dst=/proof" \
            --workdir /repo berry-p2-ci \
            python3 tools/build_p2.py --sdk-dir /tmp/Catalina --output-dir /proof \
            2>&1 | tee "$RUNNER_TEMP/berry-target/container.log"
      - name: Retain compile-only image and full provenance even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-compile-only-evidence
          path: |
            ${{ runner.temp }}/berry-target/container.log
            ${{ runner.temp }}/berry-target/proof/result.json
            ${{ runner.temp }}/berry-target/proof/logs/
            ${{ runner.temp }}/berry-target/proof/source/build/p2/catalina/xmm/
          if-no-files-found: error
          retention-days: 14
